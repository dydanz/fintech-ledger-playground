name: auth-api

# Container stdout is kept by the json-file driver (rotated) and tailed from
# the Docker socket by Grafana Alloy, which ships it to Loki. Only containers
# labelled logging=alloy are collected.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: .
      args:
        CMD: api
    image: auth-api:local
    environment:
      SERVICE_NAME: auth-api
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-auth}:${POSTGRES_PASSWORD:-auth_dev_password}@postgres:5432/${POSTGRES_DB:-auth}?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    labels:
      logging: alloy
    logging: *logging
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  ledger-api:
    build:
      context: .
      args:
        CMD: ledger-api
    image: ledger-api:local
    environment:
      SERVICE_NAME: ledger-api
      LEDGER_HTTP_ADDR: ":8081"
      DATABASE_URL: postgres://${POSTGRES_USER:-auth}:${POSTGRES_PASSWORD:-auth_dev_password}@postgres:5432/${POSTGRES_DB:-auth}?sslmode=disable
      # auth-api's session store: /api/v1/ledger accepts auth-api login tokens.
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password}
      # client_id:sha256(token):ops;...  The default holds the dev tokens from .env.example.
      LEDGER_CLIENTS: ${LEDGER_CLIENTS:-onboarding:a8c31043ceb39b82f03c6095246e32adf5212405f8120dfba3a0da352ba9b933:account_open,read;payments:8d1ae9dffc3b7a38a480abbc728a279204e08ea8d60189b01cbee0fef1732bfa:credit,debit,read;ops:9d121d994c8c0ac8cc7786f5c0c775588c389b87416c38dd89acdefde3757d21:account_open,credit,debit,void,freeze,unfreeze,read;fraud-engine:3bdbcf9e9cfbca308c91ab7b78bc6a1738f5ab8c13241d00ecb6371a0d10630d:freeze;console:ff15c6028c0197f8656b2745adece2ee0d037a6695303abaf56af4b89f64d57e:read}
      LEDGER_OVERDRAFT_CLIENTS: ${LEDGER_OVERDRAFT_CLIENTS:-ops}
      LEDGER_UNFREEZE_CLIENTS: ${LEDGER_UNFREEZE_CLIENTS:-ops}
      LEDGER_CURRENCIES: ${LEDGER_CURRENCIES:-IDR}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      # Internal API: never expose beyond the host (TRD §6.1).
      - "127.0.0.1:8081:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    labels:
      logging: alloy
    logging: *logging
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  ledger-worker:
    build:
      context: .
      args:
        CMD: ledger-worker
    image: ledger-worker:local
    environment:
      SERVICE_NAME: ledger-worker
      WORKER_HTTP_ADDR: ":8082"
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_EVENTS: ${KAFKA_TOPIC_EVENTS:-ledger.events.v1}
      DATABASE_URL: postgres://${POSTGRES_USER:-auth}:${POSTGRES_PASSWORD:-auth_dev_password}@postgres:5432/${POSTGRES_DB:-auth}?sslmode=disable
      LEDGER_CURRENCIES: ${LEDGER_CURRENCIES:-IDR}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RECONCILE_INTERVAL: ${RECONCILE_INTERVAL:-1m}
      # Archiver (TRD §7.8) into the local write-once store below. The bucket
      # is created with Object Lock in compliance mode; 1 day of retention
      # keeps local drills disposable (production: 36500, a pre-made bucket).
      LEDGER_ARCHIVE_AFTER: ${LEDGER_ARCHIVE_AFTER:-61320h}
      LEDGER_LEGAL_HOLD: ${LEDGER_LEGAL_HOLD:-}
      ARCHIVE_BUCKET_URI: s3://ledger-archive
      ARCHIVE_S3_ENDPOINT: archive-store:7070
      ARCHIVE_S3_ACCESS_KEY: ${ARCHIVE_S3_ACCESS_KEY:-archive-dev}
      ARCHIVE_S3_SECRET_KEY: ${ARCHIVE_S3_SECRET_KEY:-archive_dev_secret}
      ARCHIVE_S3_SECURE: "false"
      ARCHIVE_CREATE_BUCKET: "true"
      ARCHIVE_RETENTION_DAYS: ${ARCHIVE_RETENTION_DAYS:-1}
    # No published port: /healthz and /readyz are for the container healthcheck.
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      archive-store:
        condition: service_healthy
    labels:
      logging: alloy
    logging: *logging
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Web console (spec/2026-11-10 Web Console Design): the React app and its
  # /console/api. Bound to the host only; the ops screens have no login (MVP).
  ledger-console:
    build:
      context: .
      dockerfile: Dockerfile.console
    image: ledger-console:local
    environment:
      SERVICE_NAME: ledger-console
      CONSOLE_HTTP_ADDR: ":8090"
      CONSOLE_AUTH_API_URL: http://api:8080
      CONSOLE_LEDGER_API_URL: http://ledger-api:8081
      # Demo money actions on My account, with the dev tokens from .env.example.
      CONSOLE_DEMO_ACTIONS: ${CONSOLE_DEMO_ACTIONS:-true}
      CONSOLE_ONBOARDING_TOKEN: ${CONSOLE_ONBOARDING_TOKEN:-dev-onboarding-token}
      CONSOLE_PAYMENTS_TOKEN: ${CONSOLE_PAYMENTS_TOKEN:-dev-payments-token}
      # The ops screens: ledger-api reads (the read-only console client) and
      # the activity signals from Loki.
      CONSOLE_READ_TOKEN: ${CONSOLE_READ_TOKEN:-dev-console-token}
      CONSOLE_LOKI_URL: http://loki:3100
      # Grafana as your browser reaches it: the trace id's Explore link.
      CONSOLE_GRAFANA_URL: ${CONSOLE_GRAFANA_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:8090:8090"
    labels:
      logging: alloy
    logging: *logging
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.1.0
    environment:
      # Single-node KRaft (broker + controller). Production: 3+ brokers,
      # RF 3, min.insync.replicas 2 (spec/TRD §7.3).
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:9094
      # Containers use kafka:9092; the host (integration tests) uses 127.0.0.1:9094.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://127.0.0.1:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafkadata:/var/lib/kafka/data
    ports:
      - "127.0.0.1:9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
    labels:
      logging: alloy
    logging: *logging
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.1.0
    # One-shot: creates the event topic (auto-create is off). Safe to re-run.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic ${KAFKA_TOPIC_EVENTS:-ledger.events.v1} --partitions 12 --replication-factor 1
        --config retention.ms=604800000 --config min.insync.replicas=1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic ${KAFKA_TOPIC_EVENTS:-ledger.events.v1}
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  fraud-engine:
    build:
      context: .
      args:
        CMD: fraud-engine
    image: fraud-engine:local
    environment:
      SERVICE_NAME: fraud-engine
      FRAUD_HTTP_ADDR: ":8083"
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_EVENTS: ${KAFKA_TOPIC_EVENTS:-ledger.events.v1}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password}
      LEDGER_API_URL: http://ledger-api:8081
      # Matches the fraud-engine entry in LEDGER_CLIENTS (freeze only).
      FRAUD_CLIENT_TOKEN: ${FRAUD_CLIENT_TOKEN:-dev-fraud-token}
      FRAUD_TOPUP_MAX: ${FRAUD_TOPUP_MAX:-3}
      FRAUD_TOPUP_WINDOW: ${FRAUD_TOPUP_WINDOW:-5m}
      FRAUD_DEBIT_WINDOW: ${FRAUD_DEBIT_WINDOW:-1h}
      FRAUD_DEBIT_MAX_COUNT: ${FRAUD_DEBIT_MAX_COUNT:-30}
      FRAUD_DEBIT_LIMITS: ${FRAUD_DEBIT_LIMITS:-IDR:50000000}
      FRAUD_FREEZE_RETRY: ${FRAUD_FREEZE_RETRY:-30s}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      ledger-api:
        condition: service_healthy
    labels:
      logging: alloy
    logging: *logging
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # `make load` only (profile): k6 inside the compose network.
  k6:
    image: grafana/k6:1.3.0
    profiles: ["load"]
    volumes:
      - ./scripts/load:/scripts:ro
    environment:
      RATE: ${RATE:-300}
      DURATION: ${DURATION:-30s}
      ACCOUNTS: ${ACCOUNTS:-50}

  postgres:
    image: postgres:17-alpine
    # Postgres's stock memory and WAL settings by default. `make load-up` raises
    # them to production-like values: with the stock 128MB / 1GB, a 30-minute
    # 500 TPS run checkpoints every minute and backends write their own dirty
    # pages (spec/2026-11-08 Load Test Results - Immutable Ledger.md).
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-128MB}
      - -c
      - max_wal_size=${PG_MAX_WAL_SIZE:-1GB}
      - -c
      - checkpoint_timeout=${PG_CHECKPOINT_TIMEOUT:-5min}
      - -c
      - wal_compression=${PG_WAL_COMPRESSION:-off}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auth_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-auth}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      logging: alloy
    logging: *logging
    restart: unless-stopped

  # Local stand-in for S3 with Object Lock (TRD §7.8): the Versity S3 gateway
  # on a posix volume. It enforces compliance-mode retention: a locked object
  # version can't be deleted, even with the governance bypass. (MinIO no
  # longer publishes container images.) Integration tests reach it on 7070.
  archive-store:
    image: versity/versitygw:v1.10.0
    entrypoint: ["sh", "-c", "mkdir -p /data/objects /data/versions && exec versitygw --access \"$$ACCESS\" --secret \"$$SECRET\" posix --versioning-dir /data/versions /data/objects"]
    environment:
      ACCESS: ${ARCHIVE_S3_ACCESS_KEY:-archive-dev}
      SECRET: ${ARCHIVE_S3_SECRET_KEY:-archive_dev_secret}
    volumes:
      - archivedata:/data
    ports:
      - "127.0.0.1:7070:7070"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7070"]
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      logging: alloy
    logging: *logging
    restart: unless-stopped

  # Schema migrations (TRD §12.1, §16 Q11): golang-migrate applies
  # migrations/*.up.sql in order and records the version in
  # public.schema_migrations. Every service that uses Postgres waits for it.
  migrate:
    image: migrate/migrate:v4.20.1
    # The command is the subcommand: `docker compose run --rm migrate version`.
    entrypoint: ["migrate", "-path", "/migrations", "-database", "postgres://${POSTGRES_USER:-auth}:${POSTGRES_PASSWORD:-auth_dev_password}@postgres:5432/${POSTGRES_DB:-auth}?sslmode=disable"]
    command: ["up"]
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      migrate-baseline:
        condition: service_completed_successfully
    labels:
      logging: alloy
    logging: *logging
    restart: "no"

  # Records the version of a database created by the old init scripts, once
  # (deploy/migrate/baseline.sh). A no-op on new and already-baselined databases.
  migrate-baseline:
    image: postgres:17-alpine
    entrypoint: ["/baseline.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-auth}
      PGPASSWORD: ${POSTGRES_PASSWORD:-auth_dev_password}
      PGDATABASE: ${POSTGRES_DB:-auth}
    volumes:
      - ./deploy/migrate/baseline.sh:/baseline.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      logging: alloy
    logging: *logging
    restart: "no"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_dev_password}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-redis_dev_password}
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      logging: alloy
    logging: *logging
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./deploy/loki/config.yaml:/etc/loki/config.yaml:ro
      - lokidata:/loki
    ports:
      - "127.0.0.1:3100:3100"
    logging: *logging
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.9.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloydata:/var/lib/alloy/data
    ports:
      - "127.0.0.1:12345:12345"
    depends_on:
      - loki
    logging: *logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - loki
    logging: *logging
    restart: unless-stopped

volumes:
  pgdata:
  kafkadata:
  redisdata:
  lokidata:
  alloydata:
  grafanadata:
  archivedata:

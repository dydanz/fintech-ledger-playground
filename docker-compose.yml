name: auth-api

# Container stdout is kept by the json-file driver (rotated) and tailed from
# the Docker socket by Grafana Alloy, which ships it to Loki. Only containers
# labelled logging=alloy are collected.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: .
      args:
        CMD: api
    image: auth-api:local
    environment:
      SERVICE_NAME: auth-api
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-auth}:${POSTGRES_PASSWORD:-auth_dev_password}@postgres:5432/${POSTGRES_DB:-auth}?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      logging: alloy
    logging: *logging
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  ledger-api:
    build:
      context: .
      args:
        CMD: ledger-api
    image: ledger-api:local
    environment:
      SERVICE_NAME: ledger-api
      LEDGER_HTTP_ADDR: ":8081"
      DATABASE_URL: postgres://${POSTGRES_USER:-auth}:${POSTGRES_PASSWORD:-auth_dev_password}@postgres:5432/${POSTGRES_DB:-auth}?sslmode=disable
      # client_id:sha256(token):ops;...  The default holds the dev tokens from .env.example.
      LEDGER_CLIENTS: ${LEDGER_CLIENTS:-onboarding:a8c31043ceb39b82f03c6095246e32adf5212405f8120dfba3a0da352ba9b933:account_open,read;payments:8d1ae9dffc3b7a38a480abbc728a279204e08ea8d60189b01cbee0fef1732bfa:credit,debit,read;ops:9d121d994c8c0ac8cc7786f5c0c775588c389b87416c38dd89acdefde3757d21:account_open,credit,debit,void,freeze,unfreeze,read}
      LEDGER_OVERDRAFT_CLIENTS: ${LEDGER_OVERDRAFT_CLIENTS:-ops}
      LEDGER_CURRENCIES: ${LEDGER_CURRENCIES:-IDR}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      # Internal API: never expose beyond the host (TRD §6.1).
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      logging: alloy
    logging: *logging
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auth_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-auth}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first start with an empty data volume.
      - ./migrations/001_init.up.sql:/docker-entrypoint-initdb.d/001_init.up.sql:ro
      - ./migrations/002_ledger.up.sql:/docker-entrypoint-initdb.d/002_ledger.up.sql:ro
      - ./migrations/003_idempotency_response_bytes.up.sql:/docker-entrypoint-initdb.d/003_idempotency_response_bytes.up.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      logging: alloy
    logging: *logging
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_dev_password}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-redis_dev_password}
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      logging: alloy
    logging: *logging
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./deploy/loki/config.yaml:/etc/loki/config.yaml:ro
      - lokidata:/loki
    ports:
      - "127.0.0.1:3100:3100"
    logging: *logging
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.9.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloydata:/var/lib/alloy/data
    ports:
      - "127.0.0.1:12345:12345"
    depends_on:
      - loki
    logging: *logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - loki
    logging: *logging
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  lokidata:
  alloydata:
  grafanadata:
